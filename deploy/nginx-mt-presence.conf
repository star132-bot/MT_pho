# Install this file inside nginx's http context and replace __DOMAIN__.
# Query strings are deliberately excluded from access logs because auth routes
# may carry one-time verification or recovery data.
log_format mt_presence '$request_id $remote_addr - $request_method $uri $status $body_bytes_sent '
                       'rt=$request_time ua="$http_user_agent"';

limit_req_zone $binary_remote_addr zone=mt_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mt_inquiry:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=mt_auth_email:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=mt_auth_login:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=mt_connection:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MTTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    access_log /var/log/nginx/mt-presence.access.log mt_presence;
    error_log /var/log/nginx/mt-presence.error.log warn;

    client_max_body_size 100m;
    client_body_timeout 120s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn mt_connection 30;
    limit_conn_status 429;
    limit_req zone=mt_general burst=40 nodelay;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
    add_header X-Request-ID $request_id always;

    location = /api/inquiries {
        limit_req zone=mt_inquiry burst=2 nodelay;
        proxy_pass http://127.0.0.1:8131;
        include /etc/nginx/snippets/mt-presence-proxy.conf;
    }

    location ~ ^/api/auth/(?:register|resend-verification|forgot-password)$ {
        limit_req zone=mt_auth_email burst=4 nodelay;
        proxy_pass http://127.0.0.1:8131;
        include /etc/nginx/snippets/mt-presence-proxy.conf;
    }

    location = /api/auth/sign-in {
        limit_req zone=mt_auth_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8131;
        include /etc/nginx/snippets/mt-presence-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8131;
        include /etc/nginx/snippets/mt-presence-proxy.conf;
    }
}
