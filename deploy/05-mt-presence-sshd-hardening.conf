# Install as /etc/ssh/sshd_config.d/05-mt-presence-hardening.conf.
# OpenSSH uses the first value it encounters, so this file sorts before
# cloud-init snippets that may enable password authentication.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 4
LoginGraceTime 30
