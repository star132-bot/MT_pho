<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>总览 | MT Presence 后台</title>
    <meta name="description" content="Staff admin for the MT Presence website." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin.css?v=20261028-admin-2" />
    <template id="mt-header-identity" data-header-identity>{"authenticated":false,"status":"pending"}</template>
  </head>
  <body class="admin-page staff-admin-page" data-admin-page="overview">
    <div class="admin-shell">
      <aside class="admin-sidebar" aria-label="后台导航">
        <a class="admin-brand" href="/admin"><strong>MT PRESENCE</strong><span>后台</span></a>
        <nav class="admin-nav" aria-label="后台页面" data-admin-nav></nav>
        <div class="admin-sidebar-foot">
          <a href="/" target="_blank" rel="noopener">查看网站 ↗</a>
          <p class="admin-connection" data-admin-connection><span class="admin-dot"></span><span data-admin-connection-label>数据连接 · 检查中</span></p>
          <div class="header-identity-slot" data-header-identity-slot></div>
        </div>
      </aside>
      <script src="/admin-shell.js?v=20261028-admin"></script>

      <main class="admin-main" id="staff-admin-main">
        <header class="admin-head">
          <div>
            <h1>总览</h1>
            <p data-overview-updated>正在读取…</p>
          </div>
          <div class="admin-head-actions">
            <button class="admin-link" type="button" data-overview-refresh>刷新</button>
            <a class="admin-button" href="/workspace/images">上传图片</a>
          </div>
        </header>

        <!-- Image processing, visitor loading and the database connection. -->
        <section class="overview-status" aria-label="运行状态">
          <div data-overview-status="processing"><span class="admin-dot"></span><span data-status-text>图片处理 · 检查中</span></div>
          <div data-overview-status="site"><span class="admin-dot"></span><span data-status-text>网站加载 · 检查中</span></div>
          <div data-overview-status="data"><span class="admin-dot"></span><span data-status-text>后台数据 · 检查中</span></div>
        </section>

        <div class="overview-grid">
          <section class="admin-panel" aria-labelledby="overview-issues-title">
            <div class="overview-panel-head">
              <h2 class="admin-section-title" id="overview-issues-title">需要处理</h2>
              <span class="admin-meta" data-overview-issues-count></span>
            </div>
            <ul class="overview-list" data-overview-issues></ul>
          </section>
          <section class="admin-panel" aria-labelledby="overview-queue-title">
            <div class="overview-panel-head">
              <h2 class="admin-section-title" id="overview-queue-title">处理队列</h2>
              <a class="admin-link" href="/workspace/images">上传图片 →</a>
            </div>
            <ul class="overview-list" data-overview-queue></ul>
          </section>
        </div>

        <section class="admin-panel" aria-labelledby="overview-log-title">
          <div class="overview-panel-head">
            <h2 class="admin-section-title" id="overview-log-title">最近操作</h2>
            <a class="admin-link" href="/admin/audit">全部记录 →</a>
          </div>
          <ol class="overview-log" data-overview-log></ol>
        </section>
      </main>
    </div>

    <script src="/account-menu.js?v=20261028-admin"></script>
    <script src="/admin-overview.js?v=20261028-admin"></script>
  </body>
</html>
