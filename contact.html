<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Artist | MT Presence</title>
    <meta
      name="description"
      content="Contact MT Presence for collection inquiries, exhibitions, commissions, or licensing."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="contact-page">
    <header class="site-header archive-header" aria-label="Primary navigation">
      <a class="brand-mark" href="index.html" aria-label="Back to home">
        <span>MT</span>
        <span>Presence</span>
      </a>
      <nav class="site-nav" aria-label="Page navigation">
        <a href="index.html">Home</a>
        <a href="works.html">Works</a>
      </nav>
    </header>

    <main class="contact-main">
      <section class="contact-page-layout" aria-labelledby="contact-page-title">
        <div class="contact-page-intro">
          <div class="section-kicker">Contact</div>
          <h1 id="contact-page-title">Contact Artist</h1>
          <p class="contact-page-lede">
            For collection inquiries, exhibitions, commissions, licensing, or quiet notes about the work.
          </p>
          <div class="contact-page-art" aria-hidden="true"></div>
        </div>

        <form class="contact-form contact-page-form" data-contact-form novalidate>
          <div class="form-field">
            <label for="contact-name">Name <span>Optional</span></label>
            <input id="contact-name" name="sender_name" type="text" autocomplete="name" maxlength="120" placeholder="Your name" />
          </div>
          <div class="form-field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="sender_email" type="email" autocomplete="email" maxlength="180" placeholder="you@example.com" required />
            <p class="field-error" data-error-for="sender_email"></p>
          </div>
          <div class="form-field">
            <label for="contact-subject">Subject <span>Optional</span></label>
            <input id="contact-subject" name="subject" type="text" maxlength="180" placeholder="Inquiry, commission, exhibition..." />
          </div>
          <div class="form-field">
            <label for="contact-message">Note</label>
            <textarea id="contact-message" name="message" rows="5" maxlength="5000" placeholder="Write your note here." required></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>
          <p class="contact-privacy">This opens your email app; no local inquiry is stored.</p>
          <button class="button button-primary contact-submit" type="submit" data-contact-submit>Open Email Draft</button>
        </form>
      </section>
    </main>

    <div class="contact-toast" role="status" aria-live="polite" data-contact-toast></div>
    <script src="contact.js?v=20260614-mailto"></script>
  </body>
</html>
