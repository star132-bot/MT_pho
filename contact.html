<!doctype html>
<html lang="en" data-image-guard>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Artist | MT Presence</title>
    <meta name="description" content="Contact MT Presence for exhibitions, editorial projects, licensing, print inquiries, and commissions." />
    <link rel="canonical" href="https://mtdo.cn/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MT Presence" />
    <meta property="og:title" content="Contact Artist | MT Presence" />
    <meta property="og:description" content="Contact MT Presence for exhibitions, editorial projects, licensing, print inquiries, and commissions." />
    <meta property="og:url" content="https://mtdo.cn/contact.html" />
    <meta property="og:image" content="https://mtdo.cn/assets/art/contact.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/site.css?v=20261027-redesign-3" />
    <template id="mt-header-identity" data-header-identity>{"authenticated":false,"status":"pending"}</template>
  </head>
  <body class="mt-page contact-page">
    <header class="mt-header" aria-label="Primary navigation" data-public-header data-global-header>
      <div class="header-identity-slot" data-header-identity-slot></div>
    </header>

    <main class="mt-contact">
      <section class="mt-contact-intro" aria-labelledby="contact-page-title">
        <p class="mt-kicker">Contact</p>
        <h1 id="contact-page-title" class="mt-contact-title">Contact Artist</h1>
        <p class="mt-contact-lede">For exhibitions, editorial projects, licensing, print inquiries, and considered commissions.</p>
        <figure class="mt-contact-image" data-protected-media>
          <img src="/assets/art/contact.jpg" alt="A dark granite cliff wrapped in rolling clouds." width="2000" height="1333" decoding="async" />
        </figure>
      </section>

      <form class="mt-form" data-contact-form novalidate aria-labelledby="contact-page-title">
        <div class="mt-field form-field">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="sender_name" type="text" autocomplete="name" maxlength="120" aria-describedby="contact-name-error" required />
          <p id="contact-name-error" class="mt-field-error" data-error-for="sender_name"></p>
        </div>
        <div class="mt-field form-field">
          <label for="contact-email">Email</label>
          <input id="contact-email" name="sender_email" type="email" autocomplete="email" maxlength="180" aria-describedby="contact-email-error" required />
          <p id="contact-email-error" class="mt-field-error" data-error-for="sender_email"></p>
        </div>
        <div class="mt-field form-field">
          <span class="mt-field-legend" id="contact-inquiry-type-label">Inquiry Type</span>
          <!-- The select carries the value; contact.js renders it as a row of
               text options (data-inquiry-choices). -->
          <select id="contact-inquiry-type" class="visually-hidden" name="inquiry_type" required aria-describedby="contact-inquiry-type-error" aria-labelledby="contact-inquiry-type-label" tabindex="-1">
            <option value="">Select an inquiry type</option>
            <option value="exhibition">Exhibition</option>
            <option value="editorial">Editorial</option>
            <option value="licensing">Licensing</option>
            <option value="print">Print</option>
            <option value="commission">Commission</option>
            <option value="other">Other</option>
          </select>
          <div class="mt-choice-row" role="radiogroup" aria-labelledby="contact-inquiry-type-label" data-inquiry-choices></div>
          <p id="contact-inquiry-type-error" class="mt-field-error" data-error-for="inquiry_type"></p>
        </div>
        <div class="mt-field form-field">
          <label for="contact-organization">Organization <span>Optional</span></label>
          <input id="contact-organization" name="organization" type="text" autocomplete="organization" maxlength="180" />
        </div>
        <div class="mt-field form-field">
          <label for="contact-project-use">Project / Intended Use</label>
          <input id="contact-project-use" name="project_use" type="text" maxlength="280" aria-describedby="contact-project-use-error" required />
          <p id="contact-project-use-error" class="mt-field-error" data-error-for="project_use"></p>
        </div>
        <div class="mt-form-row">
          <div class="mt-field form-field">
            <label for="contact-timeline">Timeline <span>Optional</span></label>
            <input id="contact-timeline" name="timeline" type="text" maxlength="120" />
          </div>
          <div class="mt-field form-field" data-budget-field hidden>
            <label for="contact-budget">Budget Range <span>Optional</span></label>
            <input id="contact-budget" name="budget_range" type="text" maxlength="120" />
          </div>
        </div>
        <section class="mt-context" data-contact-context hidden aria-labelledby="contact-context-title">
          <div class="mt-field-legend"><span id="contact-context-title">Works in this inquiry</span> <span data-contact-context-source></span></div>
          <div class="mt-context-list" data-contact-context-list></div>
        </section>
        <div class="mt-field form-field">
          <label for="contact-message">Message</label>
          <textarea
            id="contact-message"
            name="message"
            rows="5"
            maxlength="5000"
            placeholder="Share the context, scope, and any details that would help begin the conversation."
            aria-describedby="contact-message-error"
            required
          ></textarea>
          <p id="contact-message-error" class="mt-field-error" data-error-for="message"></p>
        </div>
        <div class="mt-honeypot" aria-hidden="true">
          <label for="contact-website">Website</label>
          <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="mt-form-privacy">
          Your name, email address, and message are stored to handle this inquiry.
          <a href="/privacy.html">Privacy notice</a>
        </p>
        <div>
          <button class="mt-text-link contact-submit" type="submit" data-contact-submit>Submit Inquiry <span aria-hidden="true">→</span></button>
        </div>
        <section class="mt-success" data-contact-success role="status" aria-live="polite" tabindex="-1" hidden>
          <p class="mt-kicker">Inquiry recorded</p>
          <h2>Reference <strong data-contact-reference></strong></h2>
          <p data-contact-success-message></p>
          <button class="mt-text-link" type="button" data-contact-another>Start another inquiry</button>
        </section>
      </form>
    </main>

    <footer class="mt-footer" aria-label="Site footer" data-site-footer data-footer-variant="public" data-footer-context="contact"></footer>

    <div class="mt-toast" role="status" aria-live="polite" data-contact-toast></div>

    <script src="/image-guard.js?v=20261021-image-guard"></script>
    <script src="/i18n.js?v=20261027-redesign-2"></script>
    <script src="/global-header.js?v=20261027-redesign"></script>
    <script src="/archive-data.js?v=20261027-redesign"></script>
    <script src="/public-archive.js?v=20261002-public-recovery"></script>
    <script src="/contact.js?v=20261027-redesign"></script>
    <script src="/site-footer.js?v=20261027-redesign"></script>
    <script src="/public-navigation.js?v=20260722-public-shell"></script>
  </body>
</html>
