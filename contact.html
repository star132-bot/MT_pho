<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Artist | MT Presence</title>
    <meta
      name="description"
      content="Contact MT Presence for collection inquiries, exhibitions, commissions, or licensing."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=20260723-global-footer-3" />
  </head>
  <body class="contact-page public-page">
    <header class="site-header archive-header public-site-header" aria-label="Primary navigation" data-public-header>
      <a class="brand-mark" href="/" aria-label="MT Presence home">
        <span>MT</span>
        <span>Presence</span>
      </a>
      <nav id="public-site-navigation" class="site-nav public-site-nav" aria-label="Primary" data-public-nav>
        <a href="/">Home</a>
        <a href="/works.html">Works</a>
        <a href="/about.html">About</a>
        <a href="/lightbox.html">Lightbox</a>
        <a href="/contact.html" aria-current="page">Contact</a>
      </nav>
      <a class="home-account-entry" href="/auth/sign-in" data-home-account-entry data-public-sign-in>Sign In</a>
      <button
        class="public-nav-toggle"
        type="button"
        aria-label="Open navigation"
        aria-controls="public-site-navigation"
        aria-expanded="false"
        title="Open navigation"
        data-public-nav-toggle
      >
        <span class="public-nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </header>

    <main class="contact-main">
      <section class="contact-page-layout" aria-labelledby="contact-page-title">
        <div class="contact-page-intro">
          <div class="section-kicker">Contact</div>
          <h1 id="contact-page-title">Contact Artist</h1>
          <p class="contact-page-lede">
            For exhibitions, editorial projects, licensing, print inquiries, and considered commissions.
          </p>
          <div class="contact-page-art" aria-hidden="true"></div>
        </div>

        <form class="contact-form contact-page-form" data-contact-form novalidate>
          <div class="form-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="sender_name" type="text" autocomplete="name" maxlength="120" placeholder="Your name" aria-describedby="contact-name-error" required />
            <p id="contact-name-error" class="field-error" data-error-for="sender_name"></p>
          </div>
          <div class="form-field">
            <label for="contact-email">Email</label>
            <input
              id="contact-email"
              name="sender_email"
              type="email"
              autocomplete="email"
              maxlength="180"
              placeholder="you@example.com"
              aria-describedby="contact-email-error"
              required
            />
            <p id="contact-email-error" class="field-error" data-error-for="sender_email"></p>
          </div>
          <div class="form-field">
            <label for="contact-inquiry-type">Inquiry Type</label>
            <select id="contact-inquiry-type" name="inquiry_type" required aria-describedby="contact-inquiry-type-error">
              <option value="">Select an inquiry type</option>
              <option value="exhibition">Exhibition</option>
              <option value="editorial">Editorial</option>
              <option value="licensing">Licensing</option>
              <option value="print">Print</option>
              <option value="commission">Commission</option>
              <option value="other">Other</option>
            </select>
            <p id="contact-inquiry-type-error" class="field-error" data-error-for="inquiry_type"></p>
          </div>
          <div class="form-field">
            <label for="contact-organization">Organization <span>Optional</span></label>
            <input id="contact-organization" name="organization" type="text" autocomplete="organization" maxlength="180" placeholder="Studio, gallery, publication..." />
          </div>
          <div class="form-field">
            <label for="contact-project-use">Project / Intended Use</label>
            <input id="contact-project-use" name="project_use" type="text" maxlength="280" placeholder="How would you like to work with the images?" aria-describedby="contact-project-use-error" required />
            <p id="contact-project-use-error" class="field-error" data-error-for="project_use"></p>
          </div>
          <div class="contact-form-row">
            <div class="form-field">
              <label for="contact-timeline">Timeline <span>Optional</span></label>
              <input id="contact-timeline" name="timeline" type="text" maxlength="120" placeholder="Month or date range" />
            </div>
            <div class="form-field" data-budget-field hidden>
              <label for="contact-budget">Budget Range <span>Optional</span></label>
              <input id="contact-budget" name="budget_range" type="text" maxlength="120" placeholder="Expected range" />
            </div>
          </div>
          <section class="contact-context" data-contact-context hidden aria-labelledby="contact-context-title">
            <div class="contact-context-heading"><h2 id="contact-context-title">Selected Works</h2><span data-contact-context-source></span></div>
            <div class="contact-context-list" data-contact-context-list></div>
          </section>
          <div class="form-field">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              rows="5"
              maxlength="5000"
              placeholder="Share the context, scope, and any details that would help begin the conversation."
              aria-describedby="contact-message-error"
              required
            ></textarea>
            <p id="contact-message-error" class="field-error" data-error-for="message"></p>
          </div>
          <p class="contact-privacy">This opens your email app; no local inquiry is stored.</p>
          <button class="button button-primary contact-submit" type="submit" data-contact-submit>Open Email Draft</button>
        </form>
      </section>
    </main>

    <footer class="site-footer public-footer" aria-label="Site footer" data-site-footer data-footer-variant="public" data-footer-context="contact"></footer>

    <div class="contact-toast" role="status" aria-live="polite" data-contact-toast></div>
    <script src="archive-data.js?v=20260610-works-viewer-editor"></script>
    <script src="public-archive.js?v=20260713-public-architecture"></script>
    <script src="contact.js?v=20260713-inquiry-context"></script>
    <script src="/site-footer.js?v=20260723-global-footer-3"></script>
    <script src="/account-menu.js?v=20260722-public-shell"></script>
    <script src="/public-navigation.js?v=20260722-public-shell"></script>
  </body>
</html>
