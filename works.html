  </head>
  <body class="mt-page works-page">
    <header class="mt-header" aria-label="Primary navigation" data-public-header data-global-header data-global-header-theme="overlay">
      <div class="header-identity-slot" data-header-identity-slot></div>
    </header>

    <!-- Requirement 06: the Works page holds only the two series posters; each
         poster opens that series in the exhibition (requirement 07). The poster
         images are site artwork until the photographer supplies finished posters. -->
    <main class="mt-posters" aria-label="Series">
      <h1 class="visually-hidden">Works</h1>
      <a class="mt-poster" href="/exhibition.html?series=colour" data-series="colour" data-series-poster>
        <figure class="mt-poster-image" data-protected-media><img data-site-image="works_poster_colour" src="/assets/art/poster-colour.jpg" alt="" width="1600" height="2000" fetchpriority="high" decoding="async" /></figure>
        <div class="mt-poster-copy">
          <p class="mt-kicker" data-i18n-skip>SERIES · COLOUR</p>
          <h2 class="mt-poster-title" data-i18n-skip>此间留彩</h2>
          <p class="mt-poster-count" data-series-count></p>
          <span class="mt-text-link">Enter the series <span aria-hidden="true">→</span></span>
        </div>
      </a>
      <a class="mt-poster" href="/exhibition.html?series=grey" data-series="grey" data-series-poster>
        <figure class="mt-poster-image" data-protected-media><img data-site-image="works_poster_grey" src="/assets/art/poster-grey.jpg" alt="" width="1600" height="2000" fetchpriority="high" decoding="async" /></figure>
        <div class="mt-poster-copy">
          <p class="mt-kicker" data-i18n-skip>SERIES · GREY</p>
          <h2 class="mt-poster-title" data-i18n-skip>此间留灰</h2>
          <p class="mt-poster-count" data-series-count></p>
          <span class="mt-text-link">Enter the series <span aria-hidden="true">→</span></span>
        </div>
      </a>
      <div class="mt-posters-status" data-series-state="loading" data-series-status-box>
        <p role="status" aria-live="polite" data-series-status>Loading works</p>
        <button class="mt-text-link" type="button" hidden data-series-retry>Retry</button>
      </div>
    </main>

    <footer class="mt-footer" aria-label="Site footer" data-site-footer data-footer-variant="public"></footer>
