    <header class="site-header archive-header public-site-header global-header" aria-label="Primary navigation" data-public-header data-global-header>
      <div class="header-identity-slot" data-header-identity-slot></div>
    </header>

    <main class="archive-main">
      <section class="archive-controls" aria-label="Archive filters">
        <div class="archive-discovery-bar">
          <div class="filter-group">
            <span class="visually-hidden">Type</span>
            <div class="filter-options" data-type-filters>
              <button class="filter-button is-active" type="button" data-filter-type="All" aria-pressed="true">All Works</button>
              <button class="filter-button" type="button" data-filter-type="Abstract" aria-pressed="false">Abstract</button>
              <button class="filter-button" type="button" data-filter-type="Concrete" aria-pressed="false">Concrete</button>
            </div>
          </div>

          <div class="filter-group">
            <span class="visually-hidden">Ratio</span>
            <div class="filter-options ratio-options" data-ratio-filters>
              <button class="filter-button" type="button" data-filter-ratio="Square" aria-pressed="false">Square</button>
              <button class="filter-button" type="button" data-filter-ratio="Portrait" aria-pressed="false">Portrait</button>
              <button class="filter-button" type="button" data-filter-ratio="Landscape" aria-pressed="false">Landscape</button>
              <button class="filter-button" type="button" data-filter-ratio="Panorama" aria-pressed="false">Panorama</button>
            </div>
          </div>
        </div>
      </section>

      <section class="archive-gallery-section" aria-labelledby="gallery-title">
        <h1 id="gallery-title" class="visually-hidden">Works Archive</h1>
        <div class="visually-hidden" data-archive-count aria-live="polite"></div>
        <p class="visually-hidden" data-archive-data-status role="status" aria-live="polite">Loading archive.</p>
        <p class="archive-empty-state" data-archive-empty hidden>No works match this search.</p>
        <div class="archive-gallery" data-archive-gallery></div>
      </section>
    </main>

    <footer class="site-footer public-footer" aria-label="Site footer" data-site-footer data-footer-variant="public"></footer>

    <div class="archive-toast" role="status" aria-live="polite" data-archive-toast hidden></div>

    <div class="work-viewer" data-work-viewer hidden>
      <div class="work-viewer-backdrop" data-viewer-close aria-hidden="true"></div>
      <section
        class="work-viewer-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="work-viewer-dialog-label"
        tabindex="-1"
        data-work-viewer-dialog
      >
        <header class="work-viewer-controls viewer-toolbar" aria-label="Work viewer controls">
          <div class="work-viewer-status">
            <p id="work-viewer-dialog-label" class="visually-hidden" data-viewer-dialog-label>Work viewer</p>
            <p class="work-viewer-position" data-viewer-position aria-live="polite"></p>
            <p class="work-viewer-mode" data-viewer-mode>Fit</p>
          </div>
          <div class="work-viewer-actions">
            <button class="work-viewer-icon-button" type="button" aria-label="Show work details" data-tooltip="Show details" aria-controls="work-viewer-details" aria-expanded="false" data-viewer-info-toggle>
              <svg class="ui-icon" aria-hidden="true" focusable="false">
                <use href="#icon-info"></use>
              </svg>
            </button>
            <button class="work-viewer-icon-button" type="button" aria-label="View actual size" data-tooltip="View actual size" aria-pressed="false" data-viewer-zoom>
              <svg class="ui-icon" aria-hidden="true" focusable="false">
                <use href="#icon-zoom-in"></use>
              </svg>
            </button>
            <button class="work-viewer-icon-button" type="button" aria-label="Previous work" data-tooltip="Previous" data-viewer-prev>
              <svg class="ui-icon" aria-hidden="true" focusable="false">
                <use href="#icon-chevron-left"></use>
              </svg>
            </button>
            <button class="work-viewer-icon-button" type="button" aria-label="Next work" data-tooltip="Next" data-viewer-next>
              <svg class="ui-icon" aria-hidden="true" focusable="false">
                <use href="#icon-chevron-right"></use>
              </svg>
            </button>
            <button class="work-viewer-icon-button" type="button" aria-label="Close work viewer" data-tooltip="Close" data-viewer-close-button>
              <svg class="ui-icon" aria-hidden="true" focusable="false">
                <use href="#icon-close"></use>
              </svg>
            </button>
          </div>
        </header>

        <div class="work-viewer-layout viewer-body">
          <figure class="work-viewer-media viewer-stage" tabindex="0" aria-label="Image viewing area" data-viewer-stage>
            <img alt="" decoding="async" data-viewer-image />
          </figure>
          <aside id="work-viewer-details" class="work-viewer-info viewer-details" aria-label="Work details" aria-hidden="true" inert data-viewer-info>
            <h2 id="work-viewer-title" data-viewer-title></h2>
            <p class="work-viewer-creator" data-viewer-creator hidden></p>
            <p id="work-viewer-note" class="work-viewer-note" data-viewer-note></p>
            <div class="work-viewer-primary-actions" aria-label="Work actions">
              <button class="work-viewer-action-button" type="button" data-viewer-action="lightbox" aria-pressed="false">
                <svg class="ui-icon" aria-hidden="true" focusable="false">
                  <use href="#icon-bookmark"></use>
                </svg>
                <span>Add to Lightbox</span>
              </button>
              <a class="work-viewer-action-button" href="contact.html?source=work" data-viewer-inquire>
                <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#icon-mail"></use></svg>
                <span>Inquire</span>
              </a>
              <button class="work-viewer-action-button" type="button" data-viewer-action="download">
                <svg class="ui-icon" aria-hidden="true" focusable="false">
                  <use href="#icon-download"></use>
                </svg>
                <span>Download</span>
              </button>
            </div>
            <dl class="work-viewer-metadata" data-viewer-metadata></dl>
            <section class="work-viewer-tags" data-viewer-tags-section hidden>
              <h3>Tags</h3>
              <div class="work-viewer-tag-groups" data-viewer-tags></div>
            </section>
            <section class="work-viewer-statement" data-viewer-statement-section hidden>
              <h3 data-viewer-statement-heading>Statement</h3>
              <p data-viewer-statement></p>
            </section>
            <section class="work-viewer-related" data-viewer-related-section hidden>
              <h3>Related Works</h3>
              <div class="work-viewer-related-grid" data-viewer-related></div>
            </section>
          </aside>
        </div>
      </section>
    </div>

</html>
