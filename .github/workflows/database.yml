name: Production Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release-gate:
    name: Production Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install trusted scanner dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-scanner.txt

      - name: Validate scanner environment template
        run: |
          set -a
          source .env.worker.example
          set +a
          test "$MT_SCANNER_CLAMAV_COMMAND" = "clamdscan --fdpass --no-summary"

      - name: Run production release gate
        run: bash scripts/release_gate.sh
