<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品管理 | MT Presence 后台</title>
    <meta name="description" content="Protected MT Presence workspace for governing published works." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin.css?v=20261028-admin-2" />
    <template id="mt-header-identity" data-header-identity>{"authenticated":false,"status":"pending"}</template>
  </head>
  <body class="admin-page admin-works-page" data-admin-page="works">
    <a class="admin-works-skip visually-hidden" href="#admin-works-main">跳到作品列表</a>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" style="display:none">
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></symbol>
      <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6" /><path d="m20 4-9 9" /><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6" /></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4z" /><path d="M12 9v5" /><path d="M12 17h.01" /></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.8" /><path d="m16 16 4.5 4.5" /></symbol>
    </svg>
    <div class="admin-shell">
      <aside class="admin-sidebar" aria-label="后台导航">
        <a class="admin-brand" href="/admin"><strong>MT PRESENCE</strong><span>后台</span></a>
        <nav class="admin-nav" aria-label="后台页面" data-admin-nav></nav>
        <div class="admin-sidebar-foot">
          <a href="/" target="_blank" rel="noopener">查看网站 ↗</a>
          <p class="admin-connection" data-admin-connection><span class="admin-dot"></span><span data-admin-connection-label>数据连接 · 检查中</span></p>
          <div class="header-identity-slot" data-header-identity-slot></div>
        </div>
      </aside>
      <script src="/admin-shell.js?v=20261028-admin"></script>

      <main class="admin-main admin-works-shell" id="admin-works-main" tabindex="-1">
        <header class="admin-head">
          <div>
            <h1>作品管理 <small data-works-list-count>0 件</small></h1>
          </div>
          <form class="admin-works-filters" data-works-filters role="search">
            <label class="admin-search">
              <span class="visually-hidden">搜索作品</span>
              <svg class="admin-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
              <input type="search" name="q" maxlength="160" autocomplete="off" placeholder="搜索标题、文件名" />
            </label>
            <button class="visually-hidden" type="submit">搜索</button>
            <button class="admin-link" type="button" data-works-clear hidden>清除</button>
            <label class="admin-select">
              <span class="visually-hidden">排序</span>
              <select name="sort">
                <option value="updated_desc">最近更新</option>
                <option value="published_desc">最近发布</option>
                <option value="uploaded_desc">最近上传</option>
                <option value="title_asc">按标题</option>
              </select>
            </label>
            <button class="admin-link" type="button" data-works-refresh>刷新</button>
          </form>
        </header>

        <!-- Status tabs; archived, deleted and taken-down only appear when used. -->
        <nav class="admin-tabs admin-works-metrics" aria-label="按状态筛选">
          <button type="button" data-status-filter="all" aria-pressed="true">全部<strong data-work-count="all">0</strong></button>
          <button type="button" data-status-filter="published" aria-pressed="false">已发布<strong data-work-count="published">0</strong></button>
          <button type="button" data-status-filter="unpublished" aria-pressed="false">已下架<strong data-work-count="unpublished">0</strong></button>
          <button type="button" data-status-filter="never_published" aria-pressed="false">草稿<strong data-work-count="never_published">0</strong></button>
          <button type="button" data-status-filter="quarantined" aria-pressed="false" data-optional-filter hidden>已撤下<strong data-work-count="quarantined">0</strong></button>
          <button type="button" data-status-filter="archived" aria-pressed="false" data-optional-filter hidden>已归档<strong data-work-count="archived">0</strong></button>
          <button type="button" data-status-filter="deleted" aria-pressed="false" data-optional-filter hidden>已删除<strong data-work-count="deleted">0</strong></button>
        </nav>

        <section class="admin-works-workspace" aria-label="作品列表与详情" data-works-workspace data-mobile-view="list">
          <section class="admin-works-inventory" aria-label="作品列表" aria-busy="true" data-works-inventory>
            <div class="admin-works-list-state" data-works-list-state role="status" aria-atomic="true">
              <span data-works-list-state-message>正在读取作品…</span>
              <button class="admin-link" type="button" data-works-list-retry hidden>重试</button>
            </div>
            <div class="admin-works-table-wrap">
              <table class="admin-table admin-works-table">
                <caption class="visually-hidden">符合筛选条件的作品</caption>
                <thead>
                  <tr><th scope="col">作品</th><th scope="col">系列</th><th scope="col">状态</th><th scope="col">图片文件</th><th scope="col">大小</th><th scope="col">加载</th><th scope="col">后台同步</th><th scope="col">操作</th></tr>
                </thead>
                <tbody data-works-list></tbody>
              </table>
            </div>
            <footer class="admin-works-pagination">
              <span class="admin-meta" data-works-range>0 / 0</span>
              <span class="admin-meta" data-works-filter-summary aria-live="polite"></span>
              <button class="admin-link" type="button" data-works-load-more hidden>加载更多</button>
            </footer>
          </section>

          <aside class="admin-works-inspector" aria-label="作品详情" aria-busy="false" data-works-detail-region hidden>
            <div class="admin-works-mobile-toolbar">
              <button class="admin-link" type="button" data-works-back-to-list>← 返回列表</button>
            </div>
            <div class="admin-works-detail-state" data-works-detail-state role="status" aria-atomic="true">
              <h2 class="admin-section-title" data-works-detail-state-title tabindex="-1">选择一件作品</h2>
              <p class="admin-meta" data-works-detail-state-message>点击表格中的「详情」查看这件作品。</p>
              <button class="admin-link" type="button" data-works-detail-retry hidden>重试</button>
            </div>
            <div class="admin-works-detail" data-works-detail hidden>
              <div class="admin-error admin-works-conflict" data-works-conflict role="alert" hidden>
                <p data-works-conflict-message></p>
                <button class="admin-link" type="button" data-works-conflict-reload>重新读取</button>
              </div>
              <figure class="admin-works-preview">
                <img alt="" decoding="async" data-works-image />
                <div class="admin-meta" data-works-image-error hidden><span>预览不可用</span></div>
              </figure>
              <header class="admin-works-detail-header">
                <button class="admin-link admin-works-close-detail" type="button" data-works-close-detail aria-label="关闭详情">关闭</button>
                <h2 class="admin-title" data-works-title tabindex="-1">未命名作品</h2>
                <p class="admin-meta" data-works-creator></p>
                <div class="admin-works-status-line">
                  <span class="admin-works-status" data-works-status></span>
                  <span class="admin-meta" data-works-version></span>
                </div>
                <a class="admin-link" href="#" target="_blank" rel="noopener" data-works-public-link hidden>在网站中查看 ↗</a>
              </header>
              <section class="admin-works-inspector-section" aria-labelledby="admin-works-publication-title">
                <h3 id="admin-works-publication-title">发布</h3>
                <dl class="admin-works-definition-list" data-works-publication></dl>
              </section>
              <section class="admin-works-inspector-section" aria-labelledby="admin-works-record-title">
                <h3 id="admin-works-record-title">图片与记录</h3>
                <dl class="admin-works-definition-list" data-works-record></dl>
              </section>
              <section class="admin-works-inspector-section" aria-labelledby="admin-works-history-title">
                <h3 id="admin-works-history-title">下架与恢复记录</h3>
                <ol class="admin-works-history" data-works-history></ol>
              </section>
              <section class="admin-works-actions" aria-labelledby="admin-works-actions-title">
                <div>
                  <h3 id="admin-works-actions-title">网站显示</h3>
                  <p class="admin-meta" data-works-action-note>需要管理员权限并完成两步验证。</p>
                </div>
                <button class="admin-button" type="button" data-works-action hidden></button>
              </section>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <dialog class="admin-works-dialog" data-works-dialog aria-labelledby="admin-works-dialog-title" aria-describedby="admin-works-dialog-description">
      <form data-works-dialog-form novalidate>
        <p class="admin-meta" data-works-dialog-kicker>网站显示</p>
        <h2 class="admin-title" id="admin-works-dialog-title" data-works-dialog-title>确认操作</h2>
        <p id="admin-works-dialog-description" data-works-dialog-description></p>
        <label>
          <span>原因</span>
          <select name="reason_code" required aria-describedby="admin-works-dialog-help admin-works-dialog-error">
            <option value="">选择原因</option>
          </select>
        </label>
        <label>
          <span>说明</span>
          <textarea name="public_message" rows="4" minlength="5" maxlength="1000" required aria-describedby="admin-works-dialog-help admin-works-dialog-error"></textarea>
        </label>
        <label>
          <span>内部备注 <small>选填</small></span>
          <textarea name="internal_note" rows="3" maxlength="2000" aria-describedby="admin-works-dialog-help admin-works-dialog-error"></textarea>
        </label>
        <p id="admin-works-dialog-help" class="admin-works-dialog-help">原因和说明会写入不可修改的操作记录；内部备注只有管理员可见。</p>
        <p id="admin-works-dialog-error" class="admin-works-dialog-error" role="alert" aria-live="assertive" data-works-dialog-error></p>
        <div class="admin-works-dialog-actions">
          <button class="admin-button-quiet" type="button" data-works-dialog-cancel>取消</button>
          <button class="admin-button" type="submit" data-works-dialog-confirm>确认</button>
        </div>
      </form>
    </dialog>
    <div class="contact-toast" role="status" aria-live="polite" aria-atomic="true" data-works-live></div>
    <script src="/account-menu.js?v=20261028-admin"></script>
    <script src="/admin-works.js?v=20261028-admin"></script>
  </body>
</html>
